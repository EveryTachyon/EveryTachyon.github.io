<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f2ec">
    <meta name="description" content="About the EveryTachyon developer notes site.">
    <title>About | EveryTachyon</title>
    <style>
        :root {
            --paper: #f3f2ec;
            --ink: #202824;
            --muted: #69716b;
            --line: #d5d8cf;
            --accent: #d94f35;
            --serif: Georgia, "Times New Roman", serif;
            --sans: "Trebuchet MS", Verdana, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        .wrap { width: min(900px, calc(100% - 48px)); margin-inline: auto; }

        header {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
        }

        a { color: inherit; }

        .brand {
            display: inline-flex;
            gap: 11px;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: white;
            font-family: var(--serif);
            font-size: 17px;
        }

        .home-link { color: var(--muted); font-size: 13px; text-underline-offset: 4px; }

        main { padding-block: 110px 130px; }

        .eyebrow {
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 700px;
            margin: 22px 0;
            font-family: var(--serif);
            font-size: 64px;
            font-weight: 400;
            line-height: 1.06;
        }

        .intro {
            max-width: 620px;
            margin-bottom: 38px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.8;
        }

        .links { display: flex; flex-wrap: wrap; gap: 24px; }

        .links a {
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            text-decoration-color: var(--accent);
            text-underline-offset: 5px;
        }

        .links a:hover { color: var(--accent); }

        @media (max-width: 600px) {
            .wrap { width: calc(100% - 36px); }
            main { padding-block: 76px 90px; }
            h1 { font-size: 46px; }
            .intro { font-size: 15px; }
        }
    </style>
</head>
<body>
    <header class="wrap">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">E</span>
            <span>EveryTachyon</span>
        </a>
        <a class="home-link" href="index.html">Back to home</a>
    </header>
    <main class="wrap">
        <p class="eyebrow">About this site</p>
        <h1>A notebook for the work behind the work.</h1>
        <p class="intro">This is a home for developer notes, project write-ups, and lessons worth keeping. There is no published content here yet; this space is ready for it when it is.</p>
        <div class="links">
            <a href="index.html#writing">Browse writing</a>
            <a href="https://github.com/EveryTachyon">Visit GitHub</a>
        </div>
    </main>
</body>
</html>
